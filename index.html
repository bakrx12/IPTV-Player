<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPTV Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">📺</span>
        <span class="brand-name">IPTV Web</span>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-outline" id="settingsBtn">⚙️ Settings</button>
      </div>
    </header>


    <main class="main-layout">

      <section class="player-section">
        <div class="video-container">
          <div class="video-wrapper">
            <div class="spinner-overlay" id="spinner">
              <div class="spinner"></div>
            </div>
            <video id="videoPlayer" controls></video>
          </div>
          <!-- Controller Notice -->
          <div class="remote-notice">
            <span>🎮 Navigation supported via Keyboard, Gamepad, Controller, or TV Remote.</span>
          </div>
        </div>
      </section>

      <!-- Sidebar -->
      <aside class="sidebar">
        <!-- Load Playlist Card -->
        <div class="card playlist-loader">
          <h3>LOAD PLAYLIST</h3>
          <div class="url-input-group">
            <input type="text" id="m3uUrlInput" placeholder="https://example.com/playlist.m3u">
            <button class="btn btn-primary" id="loadUrlBtn">Load</button>
            <button class="btn btn-secondary" id="uploadFileBtn">📁 Open File</button>
            <input type="file" id="m3uFile" accept=".m3u, .m3u8" style="display: none;">
          </div>
        </div>

        <!-- Channels Container -->
        <div class="card channel-panel">
          <div class="panel-header">
            <h3>CHANNELS</h3>
            <span id="channelCount" class="count-badge">0</span>
          </div>
          
          <!-- Search box moved inside channels section -->
          <div class="channel-search-wrapper">
            <input type="text" id="searchInput" placeholder="Search channels, categories, countries...">
          </div>

          <div class="channels-container" id="channelsContainer">
            <!-- Channel card items generated here dynamically -->
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="core.js"></script>
</body>
</html>
